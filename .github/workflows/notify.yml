name: Morning reminders

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send to everyone right now (test), ignoring the 8am schedule"
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: notify
        run: npm install --no-audit --no-fund
      - name: Send reminders
        working-directory: notify
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: node notify.js
